<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="แดชบอร์ดและระบบติดตามงานซ่อมสำหรับแผนกบริการ">
  <meta name="theme-color" content="#edfafa">
  <title>Service Repair Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
  <script defer src="dashboard.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="output.js"></script>
  <script defer src="live.js"></script>
  <script defer src="events.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark" data-icon="wrench"></span><span><strong>Service Repair</strong><small>TRACKING SYSTEM</small></span></a>
    <nav aria-label="เมนูหลัก">
      <div class="nav-label">พื้นที่ทำงาน</div>
      <a href="#dashboard" data-route="dashboard"><span data-icon="layout"></span> Dashboard</a>
      <div class="repair-links">
        <a href="#repairs" data-route="repairs"><span data-icon="list"></span> งานรอตรวจสอบ</a>
        <a href="#in-progress" data-route="in-progress"><span data-icon="wrench"></span> อยู่ระหว่างซ่อม</a>
        <a href="#quotations" data-route="quotations"><span data-icon="receipt"></span> เสนอราคา</a>
      </div>
      <a href="#admin" data-route="admin"><span data-icon="settings"></span> Admin</a>
      <div class="portal-links" id="portal-links" hidden>
        <div class="nav-label">ข้อมูลฝ่ายบริการ</div>
        <a href="#products" data-route="products"><span data-icon="box"></span> ข้อมูลผลิตภัณฑ์</a>
        <a href="#service-debtors" data-route="service-debtors"><span data-icon="receipt"></span> รายการลูกหนี้ Service</a>
      </div>
    </nav>
    <div class="side-footer"><span class="avatar" data-icon="user"></span><span><strong>แผนกบริการ</strong><small>พื้นที่สาธิต</small></span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>แผนกบริการ</span><span data-icon="chevron"></span><strong id="breadcrumb">Dashboard</strong></div>
      <div class="data-actions"><span id="source-status" class="demo"><i></i> ข้อมูลจำลอง</span>
        <button id="refresh-db" class="button compact" data-action="reload-live-data" hidden>โหลดข้อมูลใหม่</button></div>
    </header>
    <main id="app"></main>
    <main id="portal-view" hidden></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><div><p class="eyebrow" id="dialog-kicker"></p><h2 id="dialog-title"></h2></div><button type="button" class="icon-button" id="dialog-close" aria-label="ปิด"><span data-icon="x"></span></button></div>
    <div id="dialog-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
